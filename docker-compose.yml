# Despliegue de demostración (sandbox). Para producción, ver docs/INSTALACION.md:
# pon VPNM_SANDBOX=false, monta las rutas reales del servidor VPN y fija los secretos.
services:
  vpn-manager:
    build: .
    image: vpn-manager:latest
    container_name: vpn-manager
    ports:
      - "8200:8200"
    environment:
      VPNM_SANDBOX: "true"
      # En producción (obligatorios): genera con `python -m vpn_manager.hashpw` y secrets.token_hex(32)
      # VPNM_ADMIN_PASSWORD_HASH: ""
      # VPNM_SECRET_KEY: ""
      # VPNM_COOKIE_SECURE: "true"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    # Todo lo que el panel escribe (PKI y clientes de demo, usuarios, auditoría, exports) va en un
    # volumen: el resto del contenedor es de solo lectura. Antes solo se montaba sandbox/data y dar de
    # alta un cliente o guardar su configuración daba error 500. Un volumen con nombre vacío se rellena
    # con el sandbox de la imagen la primera vez.
    volumes:
      - vpnm-sandbox:/app/sandbox
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  vpnm-sandbox:

[project]
name = "vpn-manager"
version = "0.3.2"
description = "Panel web para gestionar servidores VPN (OpenVPN y WireGuard)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "itsdangerous>=2.1",
    "python-multipart>=0.0.9",
    "segno>=1.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "httpx2>=2.16",   # cliente del TestClient de Starlette actual
    "httpx>=0.27",    # el de las Starlette antiguas que admite fastapi>=0.110
    "ruff==0.17.3",
]
e2e = [
    "pytest>=7.4",
    "pytest-playwright>=0.5",
]

[tool.setuptools.packages.find]
include = ["vpn_manager*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
